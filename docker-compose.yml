services:
  mysql:
    image: mysql:8.4
    container_name: hair-salon-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/salondb.sql:/docker-entrypoint-initdb.d/salondb.sql:ro

volumes:
  mysql_data: