<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hair Salon - Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"           rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f5f7;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #333;
        }

        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: #202020;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            padding: 24px 16px;
            overflow-y: auto;
        }

        .brand {
            text-align: center;
            padding-bottom: 24px;
            border-bottom: 1px solid #3a3a3a;
        }

        .brand-title {
            font-size: 25px;
            font-weight: 700;
            margin: 0;
        }

        .brand-subtitle {
            color: #bdbdbd;
            font-size: 12px;
            margin-top: 5px;
        }

        .admin-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 11px;
            background: #f7e7e9;
            color: #a92b36;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .menu-title {
            color: #8f8f8f;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin: 25px 10px 10px;
            letter-spacing: 0.7px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            margin-bottom: 5px;
            color: #d7d7d7;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .menu-link:hover {
            background: #333;
            color: #fff;
        }

        .menu-link.active {
            background: #b22f3a;
            color: #fff;
        }

        .menu-icon {
            width: 22px;
            text-align: center;
            font-size: 15px;
        }

        .main-content {
            margin-left: 260px;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        .top-header {
            height: 74px;
            background: white;
            border-bottom: 1px solid #e4e4e4;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .page-title {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: #2d2d2d;
        }

        .page-subtitle {
            margin: 3px 0 0;
            font-size: 12px;
            color: #888;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(
                    145deg,
                    #ad2c38,
                    #d54e58
            );
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
        }

        .user-role {
            font-size: 11px;
            color: #8a8a8a;
        }

        .logout-btn {
            border: 1px solid #dc3545;
            color: #b22f3a;
            background: white;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #b22f3a;
            color: white;
        }

        .content {
            padding: 28px;
            flex: 1;
        }

        .welcome-box {
            background: linear-gradient(135deg, #b22f3a, #d54b56);
            color: white;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 24px rgba(178, 47, 58, 0.18);
        }

        .welcome-box h2 {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
        }

        .welcome-box p {
            margin: 7px 0 0;
            color: #ffe8ea;
            font-size: 14px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e7e7e7;
            padding: 21px;
            height: 100%;
            transition: 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.07);
        }

        .stat-title {
            font-size: 13px;
            color: #888;
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #292929;
        }

        .stat-icon {
            width: 43px;
            height: 43px;
            background: #f8e9eb;
            color: #b22f3a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .section-card {
            background: white;
            border: 1px solid #e7e7e7;
            margin-top: 25px;
            padding: 24px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .section-subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .quick-card {
            display: block;
            text-decoration: none;
            color: #333;
            border: 1px solid #e5e5e5;
            padding: 19px;
            height: 100%;
            transition: 0.2s;
            background: #fff;
        }

        .quick-card:hover {
            border-color: #c84a54;
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }

        .quick-icon {
            width: 42px;
            height: 42px;
            background: #f8e9eb;
            color: #b22f3a;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 13px;
        }

        .quick-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .quick-description {
            color: #898989;
            font-size: 12px;
            margin: 0;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            color: #969696;
            font-size: 12px;
            padding: 20px 25px;
            background: #fff;
            border-top: 1px solid #e4e4e4;
        }

        .footer strong {
            color: #b22f3a;
        }

        @media (max-width: 992px) {
            .sidebar {
                width: 220px;
            }

            .main-content {
                margin-left: 220px;
            }
        }

        @media (max-width: 768px) {

            .sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
            }

            .top-header {
                height: auto;
                padding: 16px;
                gap: 15px;
            }

            .user-area {
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .content {
                padding: 18px;
            }
        }

    </style>

</head>

<body>

<aside class="sidebar">

    <div class="brand">
        <h1 class="brand-title">Hair Salon</h1>
        <span class="admin-badge">ADMIN</span>
    </div>

    <div class="menu-title">Tổng quan</div>
    <a th:href="@{/admin/dashboard}" class="menu-link active">Dashboard</a>

    <div class="menu-title">Quản lý</div>

    <a th:href="@{/admin/users}" class="menu-link">Người dùng</a>

</aside>

<div class="main-content">

    <header class="top-header">

        <div>

            <h2 class="page-title">Dashboard</h2>

            <p class="page-subtitle">Tổng quan hoạt động Hair Salon</p>

        </div>

        <div class="user-area">

            <div class="avatar" th:text="${#strings.substring(fullname, 0, 1).toUpperCase()}">A</div>

            <div>
                <div class="user-name" th:text="${fullname}">Hair Salon Admin</div>

                <div class="user-role">ADMIN</div>

            </div>

            <form th:action="@{/admin/logout}" method="post" class="ms-2">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <button type="submit" class="logout-btn">Đăng xuất

                </button>

            </form>

        </div>

    </header>

    <main class="content">

        <section class="welcome-box">

            <h2>Xin chào,
                <span th:text="${fullname}"></span>
            </h2>

            <p>Chào mừng bạn quay trở lại hệ thống quản trị Hair Salon.</p>

        </section>

    </main>
    <div class="footer">© 2026<strong>Hair Salon</strong>· Admin System</div>
</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
