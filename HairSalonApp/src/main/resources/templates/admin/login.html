<!DOCTYPE html>

<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair Salon - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f5f5, #e9ecef);
            color: #333;
        }

        .topbar {
            height: 52px;
            background: #202020;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .page {
            min-height: calc(100vh - 52px);
            display: flex;
            flex-direction: column;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px 24px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border: 1px solid #e3e3e3;
            padding: 32px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #ad2c38, #d54e58);
            color: #fff;
            box-shadow: 0 10px 22px rgba(173, 44, 56, 0.22);
        }

        .brand h1 {
            margin: 0;
            font-size: 27px;
            color: #292929;
        }

        .brand p {
            margin: 6px 0 0;
            font-size: 14px;
            color: #7b7b7b;
        }

        .badge {
            display: inline-block;
            margin-top: 11px;
            padding: 5px 10px;
            background: #f8e9eb;
            color: #a82b37;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .4px;
            text-transform: uppercase;
        }

        .title {
            text-align: center;
            margin: 20px 0;
        }

        .title h2 {
            margin: 0;
            font-size: 21px;
            font-weight: 600;
            color: #555;
        }

        .group {
            margin-bottom: 2px;
        }

        .group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .wrap {
            position: relative;
        }

        .wrap .left-icon {
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d5d5d5;
            padding: 0 10px 0 5px;
            outline: none;
            font-size: 14px;
            transition: .2s;
        }

        input:focus {
            border-color: #c43d48;
            box-shadow: 0 0 0 3px rgba(196, 61, 72, .10);
        }

        .toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #888;
            padding: 7px;
            cursor: pointer;
        }

        .toggle:hover {
            background: #f1f1f1;
        }

        .actions {
            text-align: right;
            margin: -2px 0 18px;
        }

        .forgot {
            color: #b02e38;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .btn {
            width: 100%;
            height: 48px;
            border: 0;
            background: linear-gradient(135deg, #b22f3a, #d54b56);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(178, 47, 58, .18);
            transition: .2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(178, 47, 58, .24);
        }

        .alert {
            padding: 11px 13px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .error {
            background: #fff0f1;
            color: #a02933;
            border: 1px solid #efc4c8;
        }

        .success {
            background: #effaf2;
            color: #2e7d43;
            border: 1px solid #cde7d3;
        }

        .footer {
            text-align: center;
            padding: 14px;
            color: #8a8a8a;
            font-size: 12px;
        }

        .footer strong {
            color: #b22f3a;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

<div class="page">
    <div class="topbar">Hair Salon Administration</div>

    <main class="main">

        <section class="card">

            <div class="brand">
                <h1>Hair Salon</h1>
            </div>

            <div class="title">
                <h2>Đăng nhập hệ thống</h2>
            </div>

            <div th:if="${param.error}" class="alert error">
                Email hoặc mật khẩu không đúng. Vui lòng thử lại.
            </div>

            <div th:if="${param.logout}" class="alert success">
                Bạn đã đăng xuất thành công.
            </div>

            <form th:action="@{/admin/login}" method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="group">

                    <label for="email">Email</label>

                    <div class="wrap">

                        <input id="email" name="email" type="email" autocomplete="username" required>

                    </div>

                </div>

                <div class="group">

                    <label for="password">Mật khẩu</label>

                    <div class="wrap">

                        <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>

                        <button type="button" class="toggle" onclick="togglePassword()">👁</button>

                    </div>

                </div>

                <button type="submit" class="btn">Đăng nhập</button>

            </form>

        </section>

    </main>

    <footer class="footer">
        © 2026
        <strong>Hair Salon</strong>
        · Admin System
    </footer>

</div>

<script>
    function togglePassword() {

        const input = document.getElementById("password");

        input.type = input.type === "password" ? "text" : "password";
    }
</script>

</body>

</html>
